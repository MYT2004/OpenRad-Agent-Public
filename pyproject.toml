[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openrad"
version = "0.1.0"
description = "Autonomous Medical Physics & Radiotherapy Intelligence Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydicom>=2.4.0,<3.0",  # dicompyler-core 0.5.x imports the removed read_file API
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.5.0",
    "python-dotenv>=1.0.0",
    "shapely>=2.0",
    "pymedphys>=0.40.0",
    "cryptography>=42.0",
    "dicompyler-core>=0.5.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["openrad*", "src*"]
exclude = ["openrad.storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
openrad = ["data/*.json"]

[project.optional-dependencies]
app = ["streamlit>=1.30", "pandas>=2.0", "pypdf>=3.0"]
api = ["fastapi>=0.100", "uvicorn>=0.23"]
test = ["pytest>=7.0", "httpx>=0.24"]

[project.scripts]
openrad-agent = "agent_main:main"
openrad-server = "server:main"

[tool.setuptools]
py-modules = ["server", "agent_main"]
