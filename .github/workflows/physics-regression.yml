name: Physics regression
on: [push, pull_request]
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[app,api,test]"
      - run: python -m pytest validation/tests -q
      - run: python agent_main.py --help
      - name: Installed wheel policy resources
        run: |
          python -m pip wheel . --no-deps -w /tmp/openrad-wheels
          python -m pip install --no-deps --target /tmp/openrad-installed /tmp/openrad-wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/openrad-installed python -c "from src.config import load_skill_policies; assert len(load_skill_policies()) == 2"
      - run: python -m pip check

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openrad-osi .
      - run: |
          docker run -d --name openrad-smoke -p 8080:8080 -e PORT=8080 openrad-osi
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs openrad-smoke
          exit 1
